name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout deploy commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key root@$SERVER_HOST '
          set -euo pipefail
          cd /home/listening
          git pull --ff-only
          SERVICE_ENV="$(systemctl show listening --property=Environment --value)"
          env $SERVICE_ENV bundle install
          env $SERVICE_ENV bundle exec rails db:migrate
          sudo systemctl restart listening
          sudo systemctl is-active --quiet listening
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
              -H "Host: listen.syftlearning.app" \
              http://127.0.0.1:4000/up; then
              exit 0
            fi
            sleep 2
          done
          exit 1
          '
